groups:
  - name: red
    rules:
      - record: http:latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))
      - record: http:error_ratio:5m
        expr: sum(rate(http_request_duration_seconds_count{status=~"4..|5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m]))